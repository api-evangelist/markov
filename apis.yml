aid: markov
name: Markov
description: >-
  Markov (Markov Studios) is a San Francisco-based Y Combinator (Summer 2026)
  startup building data and environments for training computer-use AI. The
  company captures how people actually use computers - screen recordings with
  synchronized mouse and keyboard inputs, annotations, and open datasets across
  real workflows in tools like Salesforce, Blender, and Photoshop, plus gaming
  data from Valorant, Minecraft, and GTA. Markov sources high-quality tasks and
  data to train the next generation of computer-use and reinforcement-learning
  models, releasing much of its work in public on Hugging Face (150k+ dataset
  downloads). Founded in 2026 by Dev Mandal (CEO) and Harish Ashok, Markov
  distributes its datasets through Hugging Face rather than a first-party API;
  this profile currently tracks no public API surface.
